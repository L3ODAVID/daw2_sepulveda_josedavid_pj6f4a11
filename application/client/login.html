<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleStore | Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">STYLE<span>STORE</span></a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="documentation.html">Documentation</a>
            <a href="login.html" class="nav-button active">Login</a>
        </nav>
    </header>

    <main class="login-page">

        <section class="login-decoration">
            <p class="eyebrow">WELCOME TO STYLESTORE</p>
            <h1>Your style.<br>Your space.</h1>
            <p>
                Sign in to manage your clothing orders and discover
                a simpler way to organize your purchases.
            </p>
        </section>

        <section class="login-container">
            <div class="login-box">
                <p class="eyebrow">YOUR ACCOUNT</p>
                <h2>Welcome back.</h2>
                <p class="form-description">
                    Enter your credentials to continue.
                </p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="primary-button full-button">
                        Sign In
                    </button>

                    <p id="loginMessage" class="form-message" aria-live="polite"></p>
                </form>

                <a href="index.html" class="text-link">← Back to Home</a>
            </div>
        </section>

    </main>

   

    <script src="js/login.js"></script>
</body>
</html>
